name: Private beta bug report
description: Report a Project Hyphen private beta issue with redacted evidence.
title: "[Private beta] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form only in a maintainer-authorized private intake. If this repository or its issues are public, do not submit a participant-level record here. Do not include notification text, file contents, URLs, IP addresses, passwords, tokens, private contact details, or personal device identifiers.

        Do not put participant identity, consent records, raw session logs, or private issue links here. If this is a security issue or privacy leak, stop here and follow SECURITY.md instead of opening a normal issue.
  - type: dropdown
    id: cohort_stage
    attributes:
      label: Cohort stage
      description: Stage B is valid only after the Stage A exit review records GO.
      options:
        - Stage A evidence beta (3-5 people)
        - Stage B expanded private beta (20-50 people)
    validations:
      required: true
  - type: input
    id: session_id
    attributes:
      label: Pseudonymous session ID
      description: Use the unique attempt ID, such as EB-01-S01. A restarted run gets a new ID. Never enter a participant name, email, handle, or unique device identifier.
      placeholder: e.g. EB-01-S01
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Exact build identity
      description: Artifact set ID, commit, artifact filename, build type, and SHA-256 checksum. Do not imply signing or release status without proof.
      placeholder: e.g. AS-01; commit 8d0c052; Hyphen-macOS-0.0.1.zip; evidence beta/ad-hoc; SHA-256 ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - macOS
        - Cross-device
        - Packaging / release
        - Documentation
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android device and OS
      description: Model, Android version, OEM skin, and install track if applicable.
      placeholder: e.g. Pixel 8, Android 16, AOSP, debug APK
  - type: input
    id: macos
    attributes:
      label: Mac model and macOS version
      description: Mac family/model and macOS version if applicable.
      placeholder: e.g. MacBook Pro M3, macOS 15.5
  - type: dropdown
    id: network
    attributes:
      label: Network case
      options:
        - Same-SSID home Wi-Fi
        - Mesh Wi-Fi
        - Phone hotspot
        - AP/client isolation
        - Enterprise or public Wi-Fi
        - VPN or private DNS active
        - Android restricted LAN mode
        - Permission denied / fallback mode
        - Not network-related
    validations:
      required: true
  - type: dropdown
    id: scenario
    attributes:
      label: Scenario
      description: Stage A must use one of the 13 exact EB-* IDs. Other is for an explicitly named Stage B scenario only.
      options:
        - EB-INSTALL-01 - Install, launch, first-use explanation
        - EB-PAIR-01 - QR or manual pairing and bilateral SAS
        - EB-PAIR-02 - Safe mismatch, reject, or cancel path
        - EB-RECOVER-01 - Controlled disconnect and explicit retry or recovery
        - EB-NOTIFY-01 - Synthetic notification post, update, and remove
        - EB-PRIVACY-01 - Tighten or disable notification policy
        - EB-TEXT-01 - Fixture text or link in both directions
        - EB-FILE-01 - Generated small and multi-file transfer
        - EB-FILE-02 - Cancel and controlled interruption or resume
        - EB-DIAG-01 - Diagnostics preview, export or cancel, and delete
        - EB-DIAG-02 - Diagnostics default-off opt-in and disable
        - EB-TRUST-01 - Forget peer or reset all
        - EB-A11Y-01 - Available accessibility and localization checks
        - Other - Stage B only; identify a stable scenario in observations
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - fail
        - blocked
        - stopped
        - pass
        - not-run
    validations:
      required: true
  - type: dropdown
    id: attempt_disposition
    attributes:
      label: Attempt disposition
      description: A restarted run uses a new session ID and does not overwrite this disposition.
      options:
        - preflight-blocked
        - completed
        - stopped
        - incomplete
    validations:
      required: true
  - type: dropdown
    id: started_denominator
    attributes:
      label: Entered the started-session denominator
      description: Yes only when preflight passed and the first required journey began. Unknown blocks Stage A GO.
      options:
        - "yes"
        - "no"
        - unknown
    validations:
      required: true
  - type: dropdown
    id: stop_condition
    attributes:
      label: Stop-condition status
      description: Do not submit security or privacy details here; stop and use SECURITY.md instead.
      options:
        - none
        - participant stopped voluntarily
        - non-security stop condition (details safely redacted)
        - suspected security/privacy condition (do not submit; use SECURITY.md)
    validations:
      required: true
  - type: dropdown
    id: crash_or_hard_failure
    attributes:
      label: Crash or HYP-M6-002 hard failure
      description: Yes includes a crash, failure-driven forced termination, unrecoverable protocol failure, or a run that cannot safely continue/close without process restart, reinstall, re-pair/reset, manual data repair, or abort for an unresolved hang/loop. Multiple events count once; unknown blocks GO.
      options:
        - "yes"
        - "no"
        - unknown
    validations:
      required: true
  - type: dropdown
    id: any_failed_journey
    attributes:
      label: Any failed journey
      description: This is independent of attempt disposition and the crash-or-hard-failure flag. Unknown blocks Stage A GO.
      options:
        - "yes"
        - "no"
        - unknown
    validations:
      required: true
  - type: dropdown
    id: required_evidence_complete
    attributes:
      label: Required evidence complete
      description: No or unknown enters missing-required-evidence accounting and blocks Stage A GO.
      options:
        - "yes"
        - "no"
        - unknown
    validations:
      required: true
  - type: input
    id: repeatability
    attributes:
      label: Repeatability and repeat count
      description: Record not-retried or the observed count over total repeats within this uninterrupted attempt. A restarted run gets a new session ID.
      placeholder: e.g. 2 of 3 repeats failed, or not-retried
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use exact actions. Keep sensitive content out.
      placeholder: |
        1. Open Hyphen on Android.
        2. Pair with Mac through QR/manual endpoint.
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: What should Hyphen have done?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      placeholder: What actually happened? Include exact visible error text when safe.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Attach or reference redacted diagnostics, screenshots, or local notes. Do not paste sensitive payloads.
      placeholder: e.g. redacted diagnostics export reviewed in the authorized private intake.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checklist
      options:
        - label: I removed notification text, file contents, URLs, IP addresses, passwords, tokens, private contact details, and personal device identifiers.
          required: true
        - label: I did not include participant identity, consent records, raw logs, or private issue links.
          required: true
        - label: This is not an exploitable security/privacy report; if it is, I will use SECURITY.md instead.
          required: true
